<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="idpad — an idea notebook with Google Docs style comments." />
    <title>idpad</title>
    <!--
      Applies the stored theme before the first paint, so a dark-theme reload
      never flashes a light page. It mirrors resolveTheme/applyTheme in
      src/theme/theme.ts; the two must be changed together.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('idpad-theme')
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          // Storage can be unavailable; the app then falls back to the OS setting.
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
