server {
    listen       8080;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API lives behind the same origin, so the SPA never needs CORS.
    # `api` is the compose service name; DNS is re-resolved on each request so
    # a restarted API container does not strand a cached address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Client-side routing: any unknown path renders the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy would keep serving the old
    # asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
