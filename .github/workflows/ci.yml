name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A new push to a branch cancels the run still in flight for it; runs on main
# are left alone so every published image has a completed build behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '24'

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- backend ----------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: go vet
        working-directory: api
        run: go vet ./...

      - name: gofmt
        working-directory: api
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6
          working-directory: api

      # The integration tests start Postgres through testcontainers, which
      # works out of the box on ubuntu-latest: Docker is already running there.
      - name: Go tests
        working-directory: api
        run: go test -race -count=1 ./...

      # --- frontend ---------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: Vitest
        working-directory: web
        run: npm run test

      - name: Build the SPA
        working-directory: web
        run: npx vite build

  build-and-push:
    name: Build and push images
    needs: lint-and-test
    # Images are only published from main and from release tags; pull requests
    # stop after lint-and-test.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
            image: ghcr.io/${{ github.repository }}/idpad-api
          - name: web
            context: ./web
            image: ghcr.io/${{ github.repository }}/idpad-web
    steps:
      - uses: actions/checkout@v5

      # QEMU is what lets the amd64 runner produce the arm64 half of the image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # The built-in token can push to packages in the same repository, so no
        # PAT is needed.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache is scoped per image so the two builds do not evict
          # each other's layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
